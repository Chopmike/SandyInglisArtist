<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#CC7722"/>
      <stop offset="40%" style="stop-color:#D2691E"/>
      <stop offset="70%" style="stop-color:#B7410E"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </radialGradient>
  </defs>
  <rect width="700" height="700" fill="url(#bg3)"/>
  <!-- Central sun/spirit design -->
  <circle cx="350" cy="320" r="100" fill="#DAA520"/>
  <circle cx="350" cy="320" r="70" fill="#E25822"/>
  <circle cx="350" cy="320" r="40" fill="#C41E3A"/>
  <circle cx="350" cy="320" r="15" fill="#FFF8DC"/>
  <!-- Radiating lines -->
  <g stroke="#FFF8DC" stroke-width="3">
    <line x1="350" y1="180" x2="350" y2="120"/>
    <line x1="350" y1="460" x2="350" y2="520"/>
    <line x1="210" y1="320" x2="150" y2="320"/>
    <line x1="490" y1="320" x2="550" y2="320"/>
    <line x1="250" y1="220" x2="200" y2="170"/>
    <line x1="450" y1="220" x2="500" y2="170"/>
    <line x1="250" y1="420" x2="200" y2="470"/>
    <line x1="450" y1="420" x2="500" y2="470"/>
  </g>
  <!-- Corner dots -->
  <g fill="#FFF8DC">
    <circle cx="80" cy="80" r="15"/>
    <circle cx="620" cy="80" r="15"/>
    <circle cx="80" cy="620" r="15"/>
    <circle cx="620" cy="620" r="15"/>
  </g>
  <!-- Text -->
  <text x="350" y="620" font-family="serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">Spirit of the Land</text>
  <text x="350" y="655" font-family="sans-serif" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle">Sandy Inglis • 2025</text>
</svg>
