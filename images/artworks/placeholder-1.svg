<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C41E3A"/>
      <stop offset="50%" style="stop-color:#D2691E"/>
      <stop offset="100%" style="stop-color:#CC7722"/>
    </linearGradient>
    <pattern id="dots1" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="3" fill="rgba(255,255,255,0.3)"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)"/>
  <rect width="800" height="600" fill="url(#dots1)"/>
  <!-- Aboriginal-style concentric circles -->
  <circle cx="400" cy="300" r="200" fill="none" stroke="#FFF8DC" stroke-width="8"/>
  <circle cx="400" cy="300" r="160" fill="none" stroke="#DAA520" stroke-width="6"/>
  <circle cx="400" cy="300" r="120" fill="none" stroke="#E2725B" stroke-width="8"/>
  <circle cx="400" cy="300" r="80" fill="none" stroke="#FFF8DC" stroke-width="4"/>
  <circle cx="400" cy="300" r="40" fill="#CC7722"/>
  <circle cx="400" cy="300" r="20" fill="#8B0000"/>
  <!-- Text -->
  <text x="400" y="520" font-family="serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">Outback Sunrise</text>
  <text x="400" y="550" font-family="sans-serif" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle">Sandy Inglis • 2025</text>
</svg>
