    <circle cx="750" cy="550" r="6"/>
  </g>
  <!-- Text -->
  <text x="400" y="530" font-family="serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">Uluru Dreams</text>
  <text x="400" y="565" font-family="sans-serif" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle">Sandy Inglis • 2025</text>
