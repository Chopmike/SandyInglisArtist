  </defs>
  <rect width="800" height="600" fill="url(#bg6)"/>
  <!-- Uluru-like rock formation -->
  <path d="M100 450 Q200 250 400 280 Q600 250 700 450 L700 600 L100 600 Z" fill="#8B0000"/>
  <path d="M150 450 Q250 300 400 320 Q550 300 650 450" stroke="#5C4033" stroke-width="4" fill="none"/>
  <!-- Stars -->
  <g fill="#FFF8DC">
    <circle cx="100" cy="80" r="3"/>
    <circle cx="200" cy="50" r="2"/>
    <circle cx="300" cy="100" r="3"/>
    <circle cx="400" cy="60" r="2"/>
    <circle cx="500" cy="90" r="3"/>
    <circle cx="600" cy="40" r="2"/>
    <circle cx="700" cy="70" r="3"/>
    <circle cx="150" cy="130" r="2"/>
    <circle cx="650" cy="120" r="2"/>
  </g>
  <!-- Southern Cross constellation -->
  <g fill="#FFF8DC">
    <circle cx="600" cy="150" r="5"/>
    <circle cx="620" cy="180" r="4"/>
    <circle cx="580" cy="200" r="5"/>
    <circle cx="560" cy="170" r="4"/>
    <circle cx="650" cy="190" r="3"/>
  </g>
  <!-- Aboriginal dot border -->
