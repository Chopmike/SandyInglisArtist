      <stop offset="0%" style="stop-color:#B7410E"/>
      <stop offset="40%" style="stop-color:#E2725B"/>
      <stop offset="70%" style="stop-color:#DAA520"/>
      <stop offset="100%" style="stop-color:#CC7722"/>
