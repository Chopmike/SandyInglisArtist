<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="skyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F4FF"/>
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="400" height="200" fill="url(#skyGrad2)"/>
  
  <!-- Blue Mountains silhouette -->
  <path d="M0,200 L50,140 L100,170 L150,120 L200,160 L250,100 L300,150 L350,130 L400,180 L400,200 Z" fill="#4A6FA5" opacity="0.6"/>
  <path d="M0,200 L80,150 L140,180 L200,140 L280,170 L350,145 L400,190 L400,200 Z" fill="#5D7FB8" opacity="0.7"/>
  
  <!-- Ground -->
  <rect x="0" y="200" width="400" height="100" fill="#8B7355"/>
  
  <!-- Grass texture -->
  <path d="M0,200 Q50,195 100,200 Q150,195 200,200 Q250,195 300,200 Q350,195 400,200" stroke="#6B8E23" stroke-width="3" fill="none"/>
  
  <!-- Eucalyptus trees -->
  <rect x="320" y="120" width="15" height="100" fill="#8B7355"/>
  <ellipse cx="327" cy="100" rx="35" ry="50" fill="#4A7C59"/>
  <ellipse cx="340" cy="120" rx="25" ry="35" fill="#5A8F6A"/>
  
  <!-- Sandy painting outdoors -->
  <!-- Portable easel -->
  <line x1="130" y1="270" x2="170" y2="170" stroke="#654321" stroke-width="5"/>
  <line x1="210" y1="270" x2="170" y2="170" stroke="#654321" stroke-width="5"/>
  <line x1="170" y1="270" x2="170" y2="180" stroke="#654321" stroke-width="4"/>
  
  <!-- Canvas -->
  <rect x="145" y="160" width="50" height="40" fill="white" stroke="#A0522D" stroke-width="2"/>
  
  <!-- Artist figure -->
  <ellipse cx="100" cy="205" rx="20" ry="22" fill="#A0A0A0"/>
  <ellipse cx="100" cy="212" rx="15" ry="18" fill="#E8C4A8"/>
  <path d="M75,235 Q65,270 70,290 L130,290 Q135,270 125,235 Z" fill="#CC7722"/>
  
  <!-- Sun hat -->
  <ellipse cx="100" cy="195" rx="30" ry="8" fill="#F5DEB3"/>
  <ellipse cx="100" cy="195" rx="18" ry="15" fill="#F5DEB3"/>
  
  <!-- Arm with brush -->
  <path d="M115,245 Q135,230 145,215" stroke="#E8C4A8" stroke-width="10" fill="none" stroke-linecap="round"/>
  <line x1="145" y1="210" x2="155" y2="195" stroke="#654321" stroke-width="3"/>
  
  <!-- Folding chair hint -->
  <rect x="50" y="250" width="40" height="30" fill="#4A6FA5" opacity="0.7"/>
  
  <!-- Art bag -->
  <rect x="230" y="250" width="35" height="40" fill="#8B4513" rx="3"/>
  
  <!-- Text -->
  <text x="200" y="295" font-family="Georgia, serif" font-size="11" fill="#36454F" text-anchor="middle" font-style="italic">Painting en plein air</text>
</svg>
