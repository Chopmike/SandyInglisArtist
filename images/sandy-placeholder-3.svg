<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="galleryWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F4F0"/>
      <stop offset="100%" style="stop-color:#EDE8E2"/>
    </linearGradient>
  </defs>
  
  <!-- Gallery wall -->
  <rect width="400" height="300" fill="url(#galleryWall)"/>
  
  <!-- Floor -->
  <rect x="0" y="250" width="400" height="50" fill="#D4C4B0"/>
  
  <!-- Large framed painting on wall -->
  <rect x="150" y="40" width="120" height="90" fill="#36454F" rx="2"/>
  <rect x="155" y="45" width="110" height="80" fill="white"/>
  
  <!-- Painting content - Aboriginal landscape -->
  <rect x="160" y="50" width="100" height="70" fill="#CC7722"/>
  <circle cx="185" cy="75" r="15" fill="#C41E3A"/>
  <circle cx="185" cy="75" r="10" fill="#D4A017"/>
  <path d="M160,100 Q185,85 210,100 Q235,115 260,100" fill="#E97451"/>
  <circle cx="175" cy="105" r="3" fill="#F5E6D3"/>
  <circle cx="195" cy="108" r="3" fill="#F5E6D3"/>
  <circle cx="215" cy="105" r="3" fill="#F5E6D3"/>
  <circle cx="235" cy="102" r="3" fill="#F5E6D3"/>
  
  <!-- Award ribbon on painting -->
  <circle cx="265" cy="55" r="12" fill="#C41E3A"/>
  <polygon points="260,65 265,85 270,65" fill="#C41E3A"/>
  <text x="265" y="59" font-family="Arial" font-size="8" fill="white" text-anchor="middle">1st</text>
  
  <!-- Sandy standing next to painting -->
  <!-- Hair -->
  <ellipse cx="100" cy="165" rx="25" ry="28" fill="#A0A0A0"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="172" rx="20" ry="24" fill="#E8C4A8"/>
  
  <!-- Face -->
  <circle cx="92" cy="168" r="2.5" fill="#36454F"/>
  <circle cx="108" cy="168" r="2.5" fill="#36454F"/>
  <path d="M94,182 Q100,188 106,182" stroke="#36454F" stroke-width="1.5" fill="none"/>
  
  <!-- Body - nice dress -->
  <path d="M70,200 Q55,280 65,300 L135,300 Q145,280 130,200 Z" fill="#C41E3A"/>
  
  <!-- Necklace -->
  <path d="M80,200 Q100,210 120,200" stroke="#D4A017" stroke-width="2" fill="none"/>
  
  <!-- Arms -->
  <path d="M75,210 Q55,240 60,260" stroke="#E8C4A8" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M125,210 Q145,240 140,260" stroke="#E8C4A8" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Hands -->
  <circle cx="60" cy="262" r="8" fill="#E8C4A8"/>
  <circle cx="140" cy="262" r="8" fill="#E8C4A8"/>
  
  <!-- Gallery spotlight effect -->
  <ellipse cx="210" cy="85" rx="80" ry="60" fill="#FFFACD" opacity="0.15"/>
  
  <!-- Other paintings on wall (smaller) -->
  <rect x="30" y="60" width="50" height="40" fill="#36454F" rx="2"/>
  <rect x="33" y="63" width="44" height="34" fill="#E97451"/>
  
  <rect x="320" y="55" width="55" height="45" fill="#36454F" rx="2"/>
  <rect x="323" y="58" width="49" height="39" fill="#D4A017"/>
  
  <!-- Text -->
  <text x="200" y="290" font-family="Georgia, serif" font-size="11" fill="#36454F" text-anchor="middle" font-style="italic">With her award-winning piece</text>
</svg>
